<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz cumpleaños, Milena</title>
    <style>
        :root {
            --nombre: "Milena";
        }

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: radial-gradient(circle at 50% 15%, #2a2a52 0%, #16162e 55%, #0d0d1e 100%);
            font-family: 'Manrope', sans-serif;
            color: #f3ecff;
            overflow-x: hidden;
        }

        .stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 60px;
            position: relative;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: .6;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .15;
            }

            50% {
                opacity: .9;
            }
        }

        /* ---- SOBRE ---- */
        #envelope-wrap {
            z-index: 1;
            text-align: center;
        }

        .envelope {
            width: 260px;
            height: 170px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .5));
        }

        .env-body {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #f6e9d8, #e9d3b3);
            border-radius: 6px;
        }

        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(0 0, 50% 55%, 100% 0);
            background: linear-gradient(135deg, #eaceab, #d9b98c);
            transform-origin: top;
            transition: transform .7s cubic-bezier(.6, -0.28, .74, .05);
            border-radius: 6px 6px 0 0;
            z-index: 3;
        }

        .env-shadow-fold {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            clip-path: polygon(0 100%, 50% 25%, 100% 100%);
            background: linear-gradient(#e2c9a5, #d3b586);
            z-index: 2;
        }

        .seal {
            position: absolute;
            left: 50%;
            top: 38%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #e8556b, #b8253f 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 4;
            box-shadow: 0 6px 14px rgba(0, 0, 0, .35);
            transition: transform .3s ease;
        }

        .envelope:hover .seal {
            transform: translate(-50%, -50%) scale(1.08);
        }

        .hint {
            margin-top: 20px;
            font-size: 13px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #c9c2f0;
            opacity: .75;
        }

        .envelope.open .env-flap {
            transform: rotateX(180deg);
        }

        #envelope-wrap.hidden {
            display: none;
        }

        /* ---- CONTENIDO ---- */
        #content {
            z-index: 1;
            max-width: 600px;
            width: 100%;
            text-align: center;
            display: none;
            animation: rise .8s ease forwards;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .eyebrow {
            font-size: 13px;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: #e0a9c4;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            font-size: clamp(32px, 7vw, 50px);
            margin: 0 0 6px;
            background: linear-gradient(90deg, #ffe9c7, #f5c9e0 60%, #c9c2f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            font-size: 15px;
            color: #c9c2f0;
            opacity: .85;
            margin-bottom: 34px;
        }

        /* ---- GLOBOS ---- */
        #balloon-field {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .balloon {
            width: 64px;
            height: 82px;
            cursor: pointer;
            position: relative;
            transition: transform .3s ease;
            animation: float 3.4s ease-in-out infinite;
        }

        .balloon:nth-child(2n) {
            animation-duration: 3.9s;
            animation-delay: .3s;
        }

        .balloon:nth-child(3n) {
            animation-duration: 3.1s;
            animation-delay: .6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .balloon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .35));
        }

        .balloon:hover {
            transform: scale(1.06);
        }

        .balloon.popped {
            animation: none;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
            transition: transform .25s ease, opacity .25s ease;
        }

        #messages {
            min-height: 70px;
            max-width: 460px;
            margin: 22px auto 8px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 19px;
            line-height: 1.6;
            color: #ffe9c7;
        }

        #messages div {
            margin-bottom: 10px;
            animation: rise .5s ease forwards;
        }

        .progress {
            font-size: 12px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #8f89c4;
            margin-top: 6px;
        }

        /* ---- REGALO ---- */
        #gift-stage {
            display: none;
            margin-top: 26px;
        }

        .gift-box {
            margin: 10px auto 6px;
            width: 110px;
            cursor: pointer;
        }

        .gift-svg {
            width: 100%;
            transition: transform .25s ease;
        }

        .gift-box:hover .gift-svg {
            transform: translateY(-4px);
        }

        .gift-caption {
            margin-top: 12px;
            font-size: 14px;
            color: #c9c2f0;
            opacity: .85;
        }

        #reveal {
            display: none;
            margin-top: 20px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-style: italic;
            color: #ffe9c7;
            animation: rise .6s ease forwards;
        }

        #signature {
            display: none;
            margin-top: 22px;
            font-size: 14px;
            color: #c9c2f0;
            opacity: .85;
            animation: rise .6s ease forwards;
        }

        canvas#confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div class="stars" id="stars"></div>
    <canvas id="confetti"></canvas>

    <div class="stage">

        <div id="envelope-wrap">
            <div class="envelope" id="envelope" onclick="openEnvelope()">
                <div class="env-shadow-fold"></div>
                <div class="env-body"></div>
                <div class="env-flap"></div>
                <div class="seal">✦</div>
            </div>
            <div class="hint">Toca el sobre para abrirlo</div>
        </div>

        <div id="content">
            <div class="eyebrow">Un mensaje especial para</div>
            <h1 id="nombre-title"></h1>
            <div class="sub">Pincha cada globo para descubrir tu mensaje</div>

            <div id="balloon-field"></div>
            <div class="progress" id="progress">0 / 5 globos</div>
            <div id="messages"></div>

            <div id="gift-stage">
                <div class="gift-box" onclick="revealGift()">
                    <svg class="gift-svg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
                        <rect x="10" y="34" width="80" height="50" rx="4" fill="#c94f6d" />
                        <rect x="10" y="34" width="80" height="14" fill="#e0a9c4" />
                        <rect x="45" y="34" width="10" height="50" fill="#ffe9c7" />
                        <rect x="10" y="34" width="80" height="4" fill="#ffe9c7" />
                        <path d="M50 34 C 30 10, 5 20, 50 34 Z" fill="#e0a9c4" />
                        <path d="M50 34 C 70 10, 95 20, 50 34 Z" fill="#e0a9c4" />
                    </svg>
                    <div class="gift-caption">Pulsa el regalo ✦</div>
                </div>

                <div id="reveal">
                    Hay un regalo de verdad esperándote 🎁<br>
                    Nos vemos pronto para dártelo en persona.
                </div>
                <div id="signature">Con cariño, Carla y Luis 💛</div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('nombre-title').textContent =
            getComputedStyle(document.documentElement).getPropertyValue('--nombre').trim().replace(/^"|"$/g, '');

        // estrellas de fondo
        const starsWrap = document.getElementById('stars');
        for (let i = 0; i < 70; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = (Math.random() * 3) + 's';
            starsWrap.appendChild(s);
        }

        function openEnvelope() {
            const env = document.getElementById('envelope');
            env.classList.add('open');
            setTimeout(() => {
                document.getElementById('envelope-wrap').classList.add('hidden');
                document.getElementById('content').style.display = 'block';
                buildBalloons();
            }, 550);
        }

        /* ----- GLOBOS ----- */
        const balloonMessages = [
            "Hoy cumples 23 años 🎂",
            "y queríamos que empezara con algo distinto.",
            "Gracias por ser como eres,",
            "por cada plan, cada risa y cada rato compartido.",
            "Esperamos que este año te traiga todo lo que mereces. 🎉"
        ];
        const balloonColors = ["#e8556b", "#f2b84b", "#6fc3d6", "#c9a7e8", "#f295b0"];
        let popped = 0;

        function balloonSVG(color) {
            return `
      <svg viewBox="0 0 60 78" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="30" cy="30" rx="27" ry="30" fill="${color}"/>
        <ellipse cx="21" cy="18" rx="7" ry="10" fill="rgba(255,255,255,0.25)"/>
        <path d="M27 59 L33 59 L30 66 Z" fill="${color}"/>
        <line x1="30" y1="66" x2="30" y2="78" stroke="#c9c2f0" stroke-width="1.5"/>
      </svg>`;
        }

        function buildBalloons() {
            const field = document.getElementById('balloon-field');
            balloonMessages.forEach((msg, i) => {
                const b = document.createElement('div');
                b.className = 'balloon';
                b.innerHTML = balloonSVG(balloonColors[i % balloonColors.length]);
                b.onclick = () => popBalloon(b);
                field.appendChild(b);
            });
        }

        function popBalloon(el) {
            if (el.classList.contains('popped')) return;
            el.classList.add('popped');

            // 1. Agregamos el mensaje que le toca según el contador 'popped'
            const msgWrap = document.getElementById('messages');
            const line = document.createElement('div');
            line.textContent = balloonMessages[popped];
            msgWrap.appendChild(line);

            // 2. Aumentamos el contador de globos reventados
            popped++;
            document.getElementById('progress').textContent = popped + ' / ' + balloonMessages.length + ' globos';

            // 3. Cuando exploten todos, mostramos el regalo
            if (popped === balloonMessages.length) {
                setTimeout(() => {
                    document.getElementById('gift-stage').style.display = 'block';
                }, 300);
            }
        }

        function revealGift() {
            document.getElementById('reveal').style.display = 'block';
            document.getElementById('signature').style.display = 'block';
            launchConfetti();
        }

        /* ----- CONFETI ----- */
        function launchConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const colors = ['#ffe9c7', '#f5c9e0', '#c9c2f0', '#e0a9c4', '#ffffff'];
            const pieces = Array.from({ length: 140 }, () => ({
                x: Math.random() * canvas.width,
                y: -20 - Math.random() * canvas.height * 0.5,
                r: 4 + Math.random() * 4,
                c: colors[Math.floor(Math.random() * colors.length)],
                speed: 2 + Math.random() * 3,
                drift: (Math.random() - 0.5) * 2,
                rot: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 8
            }));
            let frame = 0;
            function tick() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.c;
                    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
                    ctx.restore();
                });
                frame++;
                if (frame < 220) requestAnimationFrame(tick);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            tick();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

</body>

</html>
